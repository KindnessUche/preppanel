spring:
  application:
    name: preppanel-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/preppanel
    username: ${DB_USERNAME:preppanel}
    password: ${DB_PASSWORD:preppanel}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  cookie:
    # MUST be true (https-only cookies) in any real deployment. Default false
    # only so local dev over plain http://localhost works out of the box.
    secure: ${COOKIE_SECURE:false}

  jwt:
    # 256-bit+ secret. Override with an env var in real use - this default is for local dev only.
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-please-32bytes+}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30

  # Optional server-side defaults for local dev. Normally each user sets their own provider key
  # in the app (Account -> API keys); those keys are never stored by the backend.
  llm:
    primary-provider: groq
    fallback-provider: gemini
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-3.1-flash-lite

  assemblyai:
    # No api-key here: each user adds their own AssemblyAI key in the app's Settings.
    base-url: https://api.assemblyai.com
    # Tried in order. Override via env if AssemblyAI renames/adds models.
    speech-models: universal-3-pro,universal-2

logging:
  level:
    # INFO by default so a real deployment never accidentally ships verbose
    # logs (which can include prompt/response content). Override to DEBUG
    # locally via LOG_LEVEL_PREPPANEL=DEBUG, or use the "dev" profile below.
    com.preppanel: ${LOG_LEVEL_PREPPANEL:INFO}
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.preppanel: DEBUG
